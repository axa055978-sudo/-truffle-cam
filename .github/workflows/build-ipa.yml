name: Build Truffle IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Create app source files
        run: |
          mkdir -p Sources Resources

          cat > Sources/AppDelegate.swift << 'SWIFT'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            func application(_ application: UIApplication,
              didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              window?.rootViewController = ViewController()
              window?.makeKeyAndVisible()
              return true
            }
          }
          SWIFT

          cat > Sources/ViewController.swift << 'SWIFT'
          import UIKit
          import WebKit
          class ViewController: UIViewController, WKNavigationDelegate {
            var webView: WKWebView!
            override func viewDidLoad() {
              super.viewDidLoad()
              let config = WKWebViewConfiguration()
              config.allowsInlineMediaPlayback = true
              config.mediaTypesRequiringUserActionForPlayback = []
              webView = WKWebView(frame: view.bounds, configuration: config)
              webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
              webView.navigationDelegate = self
              webView.scrollView.bounces = false
              webView.isOpaque = false
              webView.backgroundColor = .black
              view.addSubview(webView)
              if let htmlPath = Bundle.main.path(forResource: "index", ofType: "html") {
                do {
                  let html = try String(contentsOfFile: htmlPath, encoding: .utf8)
                  webView.loadHTMLString(html, baseURL: Bundle.main.bundleURL)
                } catch {
                  webView.loadHTMLString("<h1>Error loading app</h1>", baseURL: nil)
                }
              }
            }
            override var prefersStatusBarHidden: Bool { return true }
            override var preferredStatusBarStyle: UIStatusBarStyle { return .lightContent }
          }
          SWIFT

          cat > Resources/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>كاشف الفقع</string>
            <key>CFBundleDisplayName</key>
            <string>كاشف الفقع</string>
            <key>CFBundleIdentifier</key>
            <string>com.truffle.detector</string>
            <key>CFBundleVersion</key>
            <string>4</string>
            <key>CFBundleShortVersionString</key>
            <string>2.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>TruffleDetector</string>
            <key>UILaunchStoryboardName</key>
            <string></string>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>arm64</string></array>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationPortrait</string></array>
            <key>UIStatusBarHidden</key>
            <true/>
            <key>UIViewControllerBasedStatusBarAppearance</key>
            <true/>
            <key>NSCameraUsageDescription</key>
            <string>التطبيق يحتاج الكاميرا لتحليل التربة واكتشاف الفقع</string>
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>التطبيق يحتاج موقعك لحساب المسافة لمناطق الفقع</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>اختيار صور من المعرض للتحليل</string>
            <key>ITSAppUsesNonExemptEncryption</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Create Xcode project spec
        run: |
          cat > project.yml << 'YAML'
          name: TruffleDetector
          options:
            bundleIdPrefix: com.truffle
            deploymentTarget:
              iOS: "15.0"
          settings:
            CODE_SIGNING_ALLOWED: "NO"
            CODE_SIGN_IDENTITY: ""
          targets:
            TruffleDetector:
              type: application
              platform: iOS
              sources:
                - Sources
              resources:
                - Resources
              info:
                path: Resources/Info.plist
              settings:
                CODE_SIGNING_ALLOWED: "NO"
                CODE_SIGN_IDENTITY: ""
                PRODUCT_BUNDLE_IDENTIFIER: com.truffle.detector
          YAML

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild -project TruffleDetector.xcodeproj \
            -scheme TruffleDetector \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Inject HTML into app bundle
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "Found app at: $APP"
          cp index.html "$APP/index.html"
          echo "HTML injected"

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r TruffleDetector.ipa Payload
          echo "IPA created: $(ls -lh TruffleDetector.ipa)"

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleDetector-IPA
          path: TruffleDetector.ipa
          retention-days: 90
