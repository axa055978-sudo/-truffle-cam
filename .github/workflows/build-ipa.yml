name: Build Truffle IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Create app source files
        run: |
          mkdir -p Sources Resources

          cat > Sources/AppDelegate.swift << 'EOF'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          cat > Sources/ViewController.swift << 'EOF'
          import UIKit
          import WebKit

          class ViewController: UIViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .black
                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []
                  let wv = WKWebView(frame: view.bounds, configuration: config)
                  wv.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  wv.isOpaque = false
                  wv.backgroundColor = .black
                  view.addSubview(wv)
                  if let path = Bundle.main.path(forResource: "index", ofType: "html"),
                     let html = try? String(contentsOfFile: path, encoding: .utf8) {
                      wv.loadHTMLString(html, baseURL: Bundle.main.bundleURL)
                  }
              }

              override var prefersStatusBarHidden: Bool { true }
          }
          EOF

          cat > Resources/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TruffleDetector</string>
            <key>CFBundleDisplayName</key>
            <string>TruffleDetector</string>
            <key>CFBundleIdentifier</key>
            <string>com.alpha.truffle</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>TruffleDetector</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSCameraUsageDescription</key>
            <string>Camera needed to scan terrain for truffles</string>
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>Location needed to map truffle spots</string>
          </dict>
          </plist>
          EOF

      - name: Create Xcode project spec
        run: |
          cat > project.yml << 'EOF'
          name: TruffleDetector
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            TruffleDetector:
              type: application
              platform: iOS
              sources:
                - path: Sources
              settings:
                base:
                  INFOPLIST_FILE: Resources/Info.plist
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  PRODUCT_BUNDLE_IDENTIFIER: com.alpha.truffle
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project TruffleDetector.xcodeproj \
            -scheme TruffleDetector \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Inject HTML into app bundle
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "App bundle: $APP"
          cp index.html "$APP/index.html"
          ls -la "$APP/index.html"
          echo "index.html injected OK"

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r TruffleDetector.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleDetector-IPA
          path: TruffleDetector.ipa
          retention-days: 90
