name: Build Truffle IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare web content
        run: |
          mkdir -p www
          cp index.html www/

      - name: Init npm and install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Init Capacitor
        run: npx cap init TruffleDetector com.alpha.truffle --web-dir www

      - name: Update CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Configure iOS permissions
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Camera needed to analyze soil'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Location needed for truffle mapping'" "$PLIST" 2>/dev/null || true

      - name: Build iOS app
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build \
            | tail -20

      - name: Package IPA
        run: |
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found"
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TruffleDetector.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleDetector-IPA
          path: TruffleDetector.ipa
          retention-days: 90
