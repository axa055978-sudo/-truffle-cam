var activeCat='all';

var catBtns=document.querySelectorAll('.cf-btn');
for(var i=0;i<catBtns.length;i++){
  (function(btn){
    var handler=function(e){
      e.preventDefault();
      for(var j=0;j<catBtns.length;j++) catBtns[j].classList.remove('on');
      btn.classList.add('on');
      activeCat=btn.getAttribute('data-cat');
      renderLocs();
    };
    btn.addEventListener('touchstart',handler,{passive:false});
    btn.addEventListener('click',handler);
  })(catBtns[i]);
}

function haversine(lat1,lng1,lat2,lng2){
  var R=6371;
  var dLat=(lat2-lat1)*Math.PI/180;
  var dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function renderLocs(){
  var box=document.getElementById('loc-box');
  var locs=[];
  for(var i=0;i<LOCS.length;i++){
    if(activeCat==='all'||LOCS[i].cat===activeCat) locs.push(LOCS[i]);
  }

  if(gLat!==null){
    for(var i=0;i<locs.length;i++){
      locs[i]=JSON.parse(JSON.stringify(locs[i]));
      locs[i].dist=haversine(gLat,gLng,locs[i].lat,locs[i].lng);
    }
    locs.sort(function(a,b){return a.dist-b.dist;});
  }

  var catIcons={truffle:'type-truffle',wadi:'type-wadi',faydah:'type-faydah',shaaban:'type-shaaban'};
  var catEmoji={truffle:'🍄',wadi:'🌊',faydah:'🌿',shaaban:'💧'};

  var html='';
  for(var i=0;i<locs.length;i++){
    var l=locs[i];
    var distTxt=l.dist!==undefined?(l.dist<1?(l.dist*1000).toFixed(0)+' م':l.dist.toFixed(0)+' كم'):'';
    html+='<div class="lc" data-lat="'+l.lat+'" data-lng="'+l.lng+'" data-name="'+l.name+'">';
    html+='<div class="lc-icon '+catIcons[l.cat]+'">'+catEmoji[l.cat]+'</div>';
    html+='<div class="lc-body">';
    html+='<div class="lc-name">'+l.name+'</div>';
    html+='<div class="lc-region">'+l.region+' — '+l.desc+'</div>';
    html+='</div>';
    if(distTxt) html+='<div class="lc-dist">'+distTxt+'</div>';
    html+='<span class="lc-nav">🧭</span>';
    html+='</div>';
  }
  box.innerHTML=html;

  var lcCards=box.querySelectorAll('.lc');
  for(var i=0;i<lcCards.length;i++){
    (function(card){
      card.addEventListener('click',function(){
        var lat=card.getAttribute('data-lat');
        var lng=card.getAttribute('data-lng');
        var name=card.getAttribute('data-name');
        var url='https://maps.apple.com/?ll='+lat+','+lng+'&q='+encodeURIComponent(name)+'&z=10';
        window.location.href=url;
      });
    })(lcCards[i]);
  }
}

// ========== SERVICE WORKER ==========
if('serviceWorker' in navigator && location.protocol==='https:'){
  var swCode="self.addEventListener('install',function(){self.skipWaiting()});self.addEventListener('activate',function(e){e.waitUntil(self.clients.claim())});self.addEventListener('fetch',function(e){e.respondWith(caches.open('truffle-v3').then(function(c){return c.match(e.request).then(function(r){var f=fetch(e.request).then(function(res){if(res.ok)c.put(e.request,res.clone());return res}).catch(function(){return r});return r||f})}))});";
  try{
    var b=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(b)).catch(function(){});
  }catch(ex){}
}

// ========== INIT ==========
startCam();
renderLocs();

})();
</script>
