name: Build Truffle IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Create app source files
        run: |
          mkdir -p Sources WebContent Config

          cp index.html WebContent/

          cat > Sources/AppDelegate.swift << 'SWIFT'
          import UIKit

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          SWIFT

          cat > Sources/ViewController.swift << 'SWIFT'
          import UIKit
          import WebKit

          class ViewController: UIViewController, WKNavigationDelegate {
              var webView: WKWebView!

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .black

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.navigationDelegate = self
                  webView.isOpaque = false
                  webView.backgroundColor = .black
                  webView.scrollView.backgroundColor = .black
                  view.addSubview(webView)

                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  } else {
                      let fallback = "<html><body style='background:#000;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui'><h1>index.html not found in bundle</h1></body></html>"
                      webView.loadHTMLString(fallback, baseURL: nil)
                  }
              }

              override var prefersStatusBarHidden: Bool { true }
          }
          SWIFT

          cat > Config/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>TruffleDetector</string>
            <key>CFBundleDisplayName</key>
            <string>كاشف الفقع</string>
            <key>CFBundleIdentifier</key>
            <string>com.alpha.truffle</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>TruffleDetector</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>NSCameraUsageDescription</key>
            <string>Camera needed to scan terrain for truffles</string>
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>Location needed to map truffle spots</string>
          </dict>
          </plist>
          PLIST

      - name: Create Xcode project spec
        run: |
          cat > project.yml << 'YAML'
          name: TruffleDetector
          options:
            deploymentTarget:
              iOS: "15.0"
          targets:
            TruffleDetector:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: WebContent
              settings:
                base:
                  INFOPLIST_FILE: Config/Info.plist
                  CODE_SIGNING_ALLOWED: "NO"
                  CODE_SIGN_IDENTITY: ""
                  PRODUCT_BUNDLE_IDENTIFIER: com.alpha.truffle
          YAML

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project TruffleDetector.xcodeproj \
            -scheme TruffleDetector \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath build

      - name: Verify bundle contents
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "=== App bundle contents ==="
          ls -la "$APP/"
          echo "=== Checking for index.html ==="
          find "$APP" -name "index.html" -type f
          if [ ! -f "$APP/index.html" ]; then
            echo "ERROR: index.html not found in app bundle!"
            exit 1
          fi
          echo "index.html found OK"

      - name: Package IPA
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r TruffleDetector.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: TruffleDetector-IPA
          path: TruffleDetector.ipa
          retention-days: 90
